<!DOCTYPE html>
<html lang="tr" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometri Tombalası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; margin: 0; padding: 0; }
        body { 
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        
        .card-enter { animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake { animation: shake 0.4s; }
        .pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-spin-fast { animation: spinFast 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes slideIn {
            from { transform: translateY(20px) scale(0.85); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        
        @keyframes spinFast {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.85); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(6px); }
        }

        @keyframes partyBounce {
            0%, 100% { transform: translateY(0) scale(1) rotate(-10deg); }
            50% { transform: translateY(-15px) scale(1.2) rotate(10deg); }
        }

        @keyframes pulseBg {
            0%, 100% { box-shadow: 0 0 0 0px rgba(255,255,255,0.7); }
            50% { box-shadow: 0 0 0 30px rgba(255,255,255,0); }
        }

        .game-cell {
            box-shadow: 0 3px 0 rgba(0,0,0,0.08);
            transition: all 0.1s ease;
        }
        .game-cell:active:not(.marked) {
            transform: translateY(2px);
            box-shadow: 0 0 0 rgba(0,0,0,0.08);
        }
        .game-cell.marked {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
            transform: translateY(2px);
        }
        
        .angle-svg { width: 1.3em; height: 0.45em; }

        @keyframes floatMagic {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-8px) rotate(8deg) scale(1.05); }
        }
        .animate-float-magic { animation: floatMagic 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-slate-800 p-2 flex flex-col font-sans select-none">
    
    <!-- Üst Bar -->
    <div class="w-full mb-2 bg-white rounded-xl shadow-sm border border-slate-200 px-3 py-1.5 flex items-center justify-between gap-2 shrink-0 h-10">
        <div class="flex items-center gap-2">
            <span class="text-xl">📐</span>
            <h1 class="text-base sm:text-lg font-extrabold text-slate-800 tracking-tight">Geometri Tombalası</h1>
        </div>
        <div class="text-[11px] sm:text-xs font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-lg border border-slate-200 text-center hidden sm:block">
            Doğru yerleştirme: <span class="text-emerald-700 font-bold bg-emerald-100 px-1 py-0.5 rounded">+100 Puan</span> | Yanlış yerleştirme: <span class="text-red-700 font-bold bg-red-100 px-1 py-0.5 rounded">-50 Puan</span>
        </div>
        <button onclick="endGameEarly()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-2.5 py-1 rounded-lg text-xs shadow-sm shrink-0 flex items-center gap-1 active:scale-95 transition-all">
            <span>🏁</span> Oyunu Bitir
        </button>
    </div>
    
    <!-- Ana İçerik Konteyneri -->
    <div class="flex-1 w-full grid grid-cols-12 gap-2 min-h-0 h-[calc(100vh-3.25rem)]">
        
        <!-- Sol Taraf: Torba ve Çekilen Kart (4 Sütun) -->
        <div class="col-span-4 flex flex-col gap-2 h-full min-h-0">
            <!-- Torba Kutusu -->
            <div class="bg-white rounded-xl shadow-sm p-2 flex flex-col items-center justify-between border border-slate-200 relative overflow-hidden flex-1 min-h-0">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest shrink-0 mb-1 z-10">Kart Çekim Torbası</h2>
                
                <div id="bag-container" class="relative cursor-pointer group flex-1 flex flex-col items-center justify-center min-h-0 w-full z-10" onclick="drawCard()">
                    <div id="bag-icon" class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 bg-gradient-to-br from-amber-500 via-amber-600 to-indigo-700 rounded-full flex items-center justify-center shadow-md border-2 border-amber-100 transition-transform group-hover:scale-105 shrink-0">
                        <svg viewBox="0 0 64 64" class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 drop-shadow-md group-hover:animate-bounce">
                          <path d="M24 10 C20 4, 44 4, 40 10 C40 15, 24 15, 24 10 Z" fill="#fde047" stroke="#b45309" stroke-width="2"/>
                          <path d="M18 16 Q32 21 46 16" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
                          <path d="M28 19 L25 26" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
                          <path d="M36 19 L39 27" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
                          <circle cx="25" cy="27" r="1.5" fill="#78350f"/>
                          <circle cx="39" cy="28" r="1.5" fill="#78350f"/>
                          <path d="M18 18 C8 25, 6 52, 17 57 C27 61, 37 61, 47 57 C58 52, 56 25, 46 18 C36 21, 28 21, 18 18 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
                          <path d="M24 24 C22 35, 24 46, 27 54" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
                          <path d="M40 24 C42 35, 40 46, 37 54" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
                          <path d="M32 23 C31 35, 32 46, 32 55" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="absolute bottom-1 right-2 bg-amber-400 text-indigo-900 font-extrabold px-2 py-0.5 rounded-full shadow border border-white text-xs">
                        Kalan: <span id="cards-left">20</span>
                    </div>
                </div>

                <button onclick="drawCard()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-lg shadow transition-colors w-full text-xs sm:text-sm shrink-0 mt-1 flex items-center justify-center gap-1.5 active:scale-95 z-10">
                    <span>✨</span> Yeni Kart Çek
                </button>
            </div>

            <!-- Çekilen Kart Gösterimi -->
            <div class="bg-white rounded-xl shadow-sm p-2 border border-slate-200 flex-1 flex flex-col items-center justify-center relative min-h-0">
                <div id="drawn-card" class="hidden w-full h-full absolute inset-0 bg-gradient-to-br from-amber-100 to-amber-300 p-2 text-center flex flex-col items-center justify-center rounded-xl border-2 border-amber-400 shadow-inner z-20">
                    <p class="text-[10px] text-amber-900 font-extrabold mb-1 tracking-widest uppercase bg-white/70 px-2 py-0.5 rounded-full shadow-sm">Sıradaki Kart</p>
                    <p id="drawn-text" class="text-sm sm:text-base md:text-lg font-black text-slate-800 leading-tight drop-shadow-sm px-1"></p>
                </div>
                
                <div id="empty-state" class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-b from-transparent to-indigo-50/50 rounded-lg">
                    <!-- Arka plan parlaması -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="w-32 h-32 bg-indigo-400/20 rounded-full blur-2xl animate-pulse"></div>
                        <div class="absolute w-24 h-24 bg-pink-400/20 rounded-full blur-xl animate-pulse" style="animation-delay: 1s;"></div>
                    </div>
                    
                    <!-- Animasyonlu simgeler -->
                    <div class="relative flex items-center justify-center mb-2">
                        <span class="text-4xl sm:text-5xl md:text-6xl animate-float-magic drop-shadow-xl z-10 relative">🪄✨</span>
                    </div>
                    
                    <!-- Büyük Metin -->
                    <h3 class="font-black text-lg sm:text-xl md:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500 leading-tight drop-shadow-sm px-2 text-center relative z-10 uppercase tracking-wide">
                        LÜTFEN YENİ KART ÇEKİNİZ
                    </h3>
                    
                    <!-- Yönlendirme okları -->
                    <div class="flex items-center gap-2 mt-3 text-indigo-400 animate-bounce relative z-10">
                        <span class="text-xl">⬆️</span>
                        <span class="font-bold text-xs sm:text-sm tracking-widest text-indigo-500/80">TORBAYA TIKLA</span>
                        <span class="text-xl">⬆️</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sağ Taraf: Tombala Kartları (8 Sütun) -->
        <div class="col-span-8 flex flex-col gap-2 h-full min-h-0">
            
            <!-- Kızlar Takımı -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-pink-200 flex flex-col flex-1 min-h-0">
                <div class="bg-gradient-to-r from-pink-500 to-rose-400 px-3.5 py-1.5 text-white flex justify-between items-center shadow-sm shrink-0 h-11 sm:h-12">
                    <h2 class="text-sm sm:text-base md:text-lg font-black flex items-center gap-2">
                        <span class="text-xl sm:text-2xl bg-white/20 p-1 rounded-lg">🙋‍♀️</span> Kızlar Takımı
                    </h2>
                    <div class="flex items-center gap-2.5">
                        <button onclick="handlePass('k', this)" class="bg-pink-800/80 hover:bg-pink-900 text-white font-extrabold px-3 py-1 rounded-lg text-xs sm:text-sm shadow-md flex items-center gap-1 active:scale-95 transition-all border border-pink-300/40">
                            <span>✋</span> PAS
                        </button>
                        <div class="bg-pink-900/50 px-3 py-1 rounded-lg text-xs sm:text-sm font-black shadow-inner flex items-center gap-1 border border-pink-300/20">
                            Puan: <span id="score-kizlar" class="font-mono text-amber-200 text-sm sm:text-base">0</span>
                        </div>
                    </div>
                </div>
                <div class="p-1 bg-pink-50 flex-1 flex flex-col min-h-0">
                    <div class="grid grid-cols-6 grid-rows-3 gap-1 w-full flex-1 min-h-0" id="grid-kizlar">
                        <!-- js rendered -->
                    </div>
                </div>
            </div>

            <!-- Erkekler Takımı -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-blue-200 flex flex-col flex-1 min-h-0">
                <div class="bg-gradient-to-r from-blue-500 to-cyan-400 px-3.5 py-1.5 text-white flex justify-between items-center shadow-sm shrink-0 h-11 sm:h-12">
                    <h2 class="text-sm sm:text-base md:text-lg font-black flex items-center gap-2">
                        <span class="text-xl sm:text-2xl bg-white/20 p-1 rounded-lg">🙋‍♂️</span> Erkekler Takımı
                    </h2>
                    <div class="flex items-center gap-2.5">
                        <button onclick="handlePass('e', this)" class="bg-blue-800/80 hover:bg-blue-900 text-white font-extrabold px-3 py-1 rounded-lg text-xs sm:text-sm shadow-md flex items-center gap-1 active:scale-95 transition-all border border-blue-300/40">
                            <span>✋</span> PAS
                        </button>
                        <div class="bg-blue-900/50 px-3 py-1 rounded-lg text-xs sm:text-sm font-black shadow-inner flex items-center gap-1 border border-blue-300/20">
                            Puan: <span id="score-erkekler" class="font-mono text-amber-200 text-sm sm:text-base">0</span>
                        </div>
                    </div>
                </div>
                <div class="p-1 bg-blue-50 flex-1 flex flex-col min-h-0">
                    <div class="grid grid-cols-6 grid-rows-3 gap-1 w-full flex-1 min-h-0" id="grid-erkekler">
                        <!-- js rendered -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function shootConfetti(x, y, multiplier = 1) {
            const emojis = ['⭐', '🎉', '🎊', '✨', '🎈', '🌟'];
            const count = 20 * multiplier;
            for (let i = 0; i < count; i++) {
                const conf = document.createElement('div');
                conf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                conf.className = 'fixed pointer-events-none z-[100] text-xl lg:text-2xl select-none drop-shadow-md';
                conf.style.left = x + 'px';
                conf.style.top = y + 'px';
                document.body.appendChild(conf);

                const angle = Math.random() * Math.PI * 2;
                const velocity = (8 + Math.random() * 15) * multiplier;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity - (8 * multiplier);

                let currX = x;
                let currY = y;
                let currVy = vy;
                let rot = Math.random() * 360;

                const animate = () => {
                    currVy += 0.5;
                    currX += vx;
                    currY += currVy;
                    rot += 12;
                    conf.style.transform = `translate(${currX - x}px, ${currY - y}px) rotate(${rot}deg)`;
                    
                    const screenHeight = window.innerHeight;
                    if (currY < screenHeight + 100) {
                        requestAnimationFrame(animate);
                    } else {
                        conf.remove();
                    }
                };
                requestAnimationFrame(animate);
            }
        }

        const angleSVG = (text) => `
        <div class="flex flex-col items-center justify-center -mt-0.5 w-full text-center">
          <svg class="angle-svg text-current" viewBox="0 0 32 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9L16 2L28 9" />
          </svg>
          <span class="leading-none mt-0.5 font-extrabold text-[10px] sm:text-xs md:text-sm tracking-wide">${text}</span>
        </div>
        `;

        const allItems = [
            { match: 'AB doğru parçası', label: '[AB]' },
            { match: 'MN doğrusu', label: 'MN' },
            { match: 'AB doğru parçasının uzunluğu', label: '|AB|' },
            { match: 'CD doğru parçası', label: '[CD]' },
            { match: 'MN ışını', label: '[MN' },
            { match: 'CD doğrusu', label: 'CD' },
            { match: 'Z noktası', label: 'Z' },
            { match: 'KL doğrusu', label: 'KL' },
            { match: 'C noktası', label: 'C' },
            { match: 'ABC açısı', label: angleSVG('ABC') },
            
            { match: 'AB ışını', label: '[AB' },
            { match: 'YZ doğrusu', label: 'YZ' },
            { match: 'KL doğru parçası', label: '[KL]' },
            { match: 'B noktası', label: 'B' },
            { match: 'KLM açısı', label: angleSVG('KLM') },
            { match: 'MN doğru parçası', label: '[MN]' },
            { match: 'CD ışını', label: '[CD' },
            { match: 'KL ışını', label: '[KL' },
            { match: 'YZ doğru parçasının uzunluğu', label: '|YZ|' },
            { match: 'AB doğrusu', label: 'AB' }
        ];

        let bag = [];
        let currentCard = null;
        let cardMatched = false;
        let scores = { k: 0, e: 0 };
        let foundCount = { k: 0, e: 0 };
        let clickAttempts = { k: 0, e: 0 };

        function init() {
            scores = { k: 0, e: 0 };
            foundCount = { k: 0, e: 0 };
            clickAttempts = { k: 0, e: 0 };
            currentCard = null;
            cardMatched = false;
            updateScores();
            updateDrawnCardUI();

            let shuffledItems = [...allItems].sort(() => Math.random() - 0.5);
            bag = [...shuffledItems].sort(() => Math.random() - 0.5);

            // 3 Ortak pul belirle
            const sharedItems = shuffledItems.slice(0, 3);
            
            // 7'şer tane benzersiz pul belirle
            const kizlarUnique = shuffledItems.slice(3, 10);
            const erkeklerUnique = shuffledItems.slice(10, 17);
            
            // Toplam 10'ar pul (3 ortak + 7 benzersiz). 3 pul hiçbir takımda olmayacak (sürpriz/boş pul).
            const kizlarItems = [...sharedItems, ...kizlarUnique];
            const erkeklerItems = [...sharedItems, ...erkeklerUnique];

            const buildLayout = (teamItems) => {
                let layout = [...teamItems];
                for(let i=0; i<8; i++) layout.push(null);
                return layout.sort(() => Math.random() - 0.5);
            };

            document.getElementById('grid-kizlar').innerHTML = generateGridHTML(buildLayout(kizlarItems), 'k');
            document.getElementById('grid-erkekler').innerHTML = generateGridHTML(buildLayout(erkeklerItems), 'e');
            document.getElementById('cards-left').innerText = bag.length;
        }

        function generateGridHTML(layoutArray, team) {
            let html = '';
            layoutArray.forEach(item => {
                if (item === null) {
                    const bgColor = team === 'e' ? 'bg-blue-200' : 'bg-pink-200';
                    const patternColor = team === 'e' ? 'rgba(59, 130, 246, 0.15)' : 'rgba(236, 72, 153, 0.15)';
                    html += `<div class="game-cell w-full h-full ${bgColor} rounded-lg shadow-inner relative overflow-hidden opacity-60 border border-white/40 cursor-pointer"
                                  onclick="handleCellClick('${team}', 'EMPTY_SLOT', this)">
                                <div class="absolute inset-0" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, ${patternColor} 8px, ${patternColor} 16px);"></div>
                             </div>`;
                } else {
                    const baseColor = team === 'e' 
                        ? 'bg-white hover:bg-blue-50 text-blue-900 border-blue-200' 
                        : 'bg-white hover:bg-pink-50 text-pink-900 border-pink-200';
                    
                    html += `
                    <div class="game-cell w-full h-full ${baseColor} rounded-lg border flex items-center justify-center text-[10px] sm:text-xs md:text-sm font-black cursor-pointer select-none relative z-10 break-all px-0.5 text-center"
                         onclick="handleCellClick('${team}', '${item.match}', this)">
                        <div class="content-wrapper transition-transform w-full flex justify-center items-center h-full">${item.label}</div>
                    </div>`;
                }
            });
            return html;
        }

        function drawCard() {
            if (bag.length === 0 && !currentCard) {
                endGameEarly();
                return;
            }
            
            // Eğer çekilen kart henüz doğru eşleştirilmediyse, torbaya geri koy
            if (currentCard && !cardMatched) {
                bag.unshift(currentCard); 
                bag.sort(() => Math.random() - 0.5);
            }

            cardMatched = false;
            clickAttempts = { k: 0, e: 0 };

            const bagIcon = document.getElementById('bag-icon');
            bagIcon.classList.remove('animate-spin-fast');
            void bagIcon.offsetWidth;
            bagIcon.classList.add('animate-spin-fast');

            setTimeout(() => {
                currentCard = bag.pop();
                updateDrawnCardUI();
                
                const rect = bagIcon.getBoundingClientRect();
                shootConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
            }, 250);
        }

        function updateDrawnCardUI() {
            const drawnText = document.getElementById('drawn-text');
            const drawnCardEl = document.getElementById('drawn-card');
            const emptyStateEl = document.getElementById('empty-state');
            document.getElementById('cards-left').innerText = bag.length;

            if (currentCard) {
                drawnText.innerText = currentCard.match;
                emptyStateEl.classList.add('hidden');
                drawnCardEl.classList.remove('hidden');
                
                drawnCardEl.classList.remove('card-enter');
                void drawnCardEl.offsetWidth;
                drawnCardEl.classList.add('card-enter');
            } else {
                drawnCardEl.classList.add('hidden');
                emptyStateEl.classList.remove('hidden');
            }
        }

        function showToast(targetEl, text) {
            const indicator = document.createElement('div');
            indicator.innerText = text;
            indicator.className = 'absolute text-slate-800 font-black text-xs sm:text-sm pointer-events-none drop-shadow-md pop z-50 bg-amber-100 px-3 py-1.5 rounded-full border border-amber-300';
            const rect = targetEl.getBoundingClientRect();
            indicator.style.left = (rect.left + rect.width/2 - 50) + 'px';
            indicator.style.top = (rect.top - 10) + 'px';
            document.body.appendChild(indicator);
            setTimeout(() => indicator.remove(), 1000);
        }

        function checkTurnEnd() {
            if (clickAttempts.k >= 1 && clickAttempts.e >= 1) {
                if (currentCard && !cardMatched) {
                    bag.unshift(currentCard);
                    bag.sort(() => Math.random() - 0.5);
                }
                currentCard = null;
                updateDrawnCardUI();
            }
        }

        function handlePass(team, buttonEl) {
            if (!currentCard) {
                showToast(buttonEl, 'Lütfen yeni kart çekiniz!');
                return;
            }
            if (clickAttempts[team] > 0) {
                showToast(buttonEl, 'Bu kart için hakkınızı kullandınız!');
                return;
            }
            
            clickAttempts[team]++;
            showToast(buttonEl, '✋ PAS GEÇİLDİ');
            
            setTimeout(checkTurnEnd, 800);
        }

        function handleCellClick(team, matchStr, element) {
            if (!currentCard) {
                showToast(element, 'Lütfen yeni kart çekiniz!');
                return;
            } 
            if (clickAttempts[team] > 0) {
                showToast(element, 'Bu kart için hakkınızı kullandınız!');
                return;
            }

            if (element.classList.contains('marked')) return;

            clickAttempts[team]++;

            if (currentCard.match === matchStr) {
                // DOĞRU CEVAP
                cardMatched = true;
                scores[team] += 100;
                foundCount[team]++;
                updateScores();
                
                element.className = `game-cell w-full h-full bg-emerald-500 border-emerald-600 text-white rounded-lg border-2 flex items-center justify-center text-[10px] sm:text-xs md:text-sm font-black select-none marked pop relative overflow-hidden`;
                element.innerHTML = `<span class="text-3xl opacity-30 absolute font-sans">✔️</span><span class="relative z-10 w-full h-full flex items-center justify-center px-0.5 text-center">${element.querySelector('.content-wrapper') ? element.querySelector('.content-wrapper').innerHTML : element.innerHTML}</span>`;

                const rect = element.getBoundingClientRect();
                shootConfetti(rect.left + rect.width/2, rect.top + rect.height/2, 1.2);

                if (foundCount[team] === 10) {
                    setTimeout(() => triggerWin(team), 800);
                }
                
                setTimeout(checkTurnEnd, 800);
            } else {
                // YANLIŞ CEVAP! (-50 Puan ve Kırmızı Flaş)
                scores[team] -= 50;
                updateScores();
                
                const isBoys = team === 'e';
                const baseBgClass = 'bg-white';
                const baseTextClass = isBoys ? 'text-blue-900' : 'text-pink-900';
                const baseBorderClass = isBoys ? 'border-blue-200' : 'border-pink-200';

                element.classList.remove('bg-white', 'hover:bg-blue-50', 'hover:bg-pink-50', 'text-blue-900', 'text-pink-900', 'border-blue-200', 'border-pink-200', 'bg-blue-200', 'bg-pink-200');
                element.classList.add('shake', 'bg-red-500', 'text-white', 'border-red-600');
                
                const indicator = document.createElement('div');
                indicator.innerText = '-50';
                indicator.className = 'absolute text-red-600 font-black text-3xl sm:text-4xl pointer-events-none drop-shadow-2xl pop z-50';
                const rect = element.getBoundingClientRect();
                indicator.style.left = (rect.left + rect.width/2 - 20) + 'px';
                indicator.style.top = (rect.top - 15) + 'px';
                document.body.appendChild(indicator);

                setTimeout(() => {
                    element.classList.remove('shake', 'bg-red-500', 'text-white', 'border-red-600');
                    element.classList.add(baseBgClass, baseTextClass, baseBorderClass);
                    indicator.remove();
                    checkTurnEnd();
                }, 600);
            }
        }

        function updateScores() {
            document.getElementById('score-erkekler').innerText = scores.e;
            document.getElementById('score-kizlar').innerText = scores.k;
        }

        function triggerWin(team) {
            const teamName = team === 'e' ? 'ERKEKLER' : 'KIZLAR';
            const color = team === 'e' ? '#0ea5e9' : '#f43f5e'; 
            const bgClass = team === 'e' ? 'bg-sky-900/90' : 'bg-rose-900/90';
            const emoji = team === 'e' ? '🙋‍♂️' : '🙋‍♀️';
            
            const modal = document.createElement('div');
            modal.className = `fixed inset-0 ${bgClass} backdrop-blur-md flex items-center justify-center z-50 animate-fade-in`;
            modal.innerHTML = `
                <div class="bg-white rounded-[2rem] p-6 sm:p-10 text-center transform scale-100 pop shadow-2xl border-4 flex flex-col items-center max-w-xl w-[90%] relative overflow-hidden" style="border-color: ${color};">
                    
                    <div class="absolute inset-0 opacity-20 pointer-events-none" style="background: radial-gradient(circle at center, ${color} 0%, transparent 70%); animation: pulseBg 2s infinite;"></div>
                    
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full flex items-center justify-center mb-4 shadow-xl text-5xl sm:text-6xl text-white relative z-10" style="background-color: ${color}; animation: partyBounce 1.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;">
                        🏆
                    </div>
                    <h1 class="text-4xl sm:text-6xl font-black mb-2 tracking-tighter drop-shadow-sm relative z-10" style="color: ${color}">TOMBALA!</h1>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-4 relative z-10">${teamName} TAKIMI KAZANDI! ${emoji}</h2>
                    
                    <div class="bg-slate-50 px-6 py-2 rounded-2xl border-2 border-slate-200 mb-6 relative z-10 transform rotate-1">
                        <p class="text-lg sm:text-2xl text-slate-600 font-bold flex items-center gap-3">
                            Toplam Puan: <strong class="text-3xl sm:text-4xl" style="color: ${color}">${scores[team]}</strong>
                        </p>
                    </div>

                    <button onclick="location.reload()" class="relative z-10 mt-2 text-slate-500 px-6 py-2.5 rounded-xl text-base font-bold border-2 border-slate-200 bg-slate-50 hover:bg-slate-100 shadow-sm active:translate-y-0.5 transition-all flex items-center gap-2">
                        <span class="text-xl">🏠</span> Ana Sayfaya Dön
                    </button>
                </div>
            `;
            document.body.appendChild(modal);

            const continuousConfetti = setInterval(() => {
                shootConfetti(Math.random() * window.innerWidth, window.innerHeight + 50, 1.2);
                shootConfetti(Math.random() * window.innerWidth, -50, 1.2);
            }, 400);

            setTimeout(() => clearInterval(continuousConfetti), 12000);
        }

        function endGameEarly() {
            let winnerText = "";
            let color = "#6366f1";
            let emoji = "🏁";

            if (scores.k > scores.e) {
                winnerText = "KIZLAR TAKIMI KAZANDI! 🙋‍♀️🎉";
                color = "#f43f5e";
                emoji = "🏆";
            } else if (scores.e > scores.k) {
                winnerText = "ERKEKLER TAKIMI KAZANDI! 🙋‍♂️🎉";
                color = "#0ea5e9";
                emoji = "🏆";
            } else {
                winnerText = "BERABERE! DOSTLUK KAZANDI 🤝";
                color = "#8b5cf6";
                emoji = "⭐";
            }

            const modal = document.createElement('div');
            modal.className = `fixed inset-0 bg-slate-900/85 backdrop-blur-md flex items-center justify-center z-50 animate-fade-in`;
            modal.innerHTML = `
                <div class="bg-white rounded-[2rem] p-6 sm:p-8 text-center transform scale-100 pop shadow-2xl border-4 flex flex-col items-center max-w-xl w-[90%] relative overflow-hidden" style="border-color: ${color};">
                    
                    <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center mb-3 shadow-xl text-4xl sm:text-5xl text-white relative z-10" style="background-color: ${color}; animation: partyBounce 1.5s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;">
                        ${emoji}
                    </div>
                    <h1 class="text-3xl sm:text-5xl font-black mb-1 tracking-tighter drop-shadow-sm relative z-10" style="color: ${color}">SÜRE DOLDU!</h1>
                    <h2 class="text-lg sm:text-2xl font-extrabold text-slate-800 mb-4 relative z-10">${winnerText}</h2>
                    
                    <div class="w-full bg-slate-50 p-3 sm:p-4 rounded-2xl border-2 border-slate-200 mb-4 relative z-10 flex flex-col gap-2">
                        <h3 class="text-xs sm:text-sm font-bold text-slate-400 uppercase tracking-widest border-b pb-1">Son Puan Durumu</h3>
                        <div class="flex justify-around items-center pt-1">
                            <div class="flex flex-col items-center">
                                <span class="text-xs sm:text-sm font-bold text-pink-600">🙋‍♀️ Kızlar Takımı</span>
                                <span class="text-2xl sm:text-3xl font-black font-mono text-pink-700">${scores.k} Puan</span>
                            </div>
                            <div class="text-xl font-black text-slate-300">VS</div>
                            <div class="flex flex-col items-center">
                                <span class="text-xs sm:text-sm font-bold text-blue-600">🙋‍♂️ Erkekler Takımı</span>
                                <span class="text-2xl sm:text-3xl font-black font-mono text-blue-700">${scores.e} Puan</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="location.reload()" class="relative z-10 mt-1 text-slate-500 px-6 py-2 rounded-xl text-sm sm:text-base font-bold border-2 border-slate-200 bg-slate-50 hover:bg-slate-100 shadow-sm active:translate-y-0.5 transition-all flex items-center gap-2">
                        <span class="text-lg">🏠</span> Ana Sayfaya Dön
                    </button>
                </div>
            `;
            document.body.appendChild(modal);

            shootConfetti(window.innerWidth / 2, window.innerHeight / 2, 2);
        }

        init();
    </script>
</body>
</html>
