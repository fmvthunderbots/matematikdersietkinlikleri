<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematik Oyunları</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="uygulama/simge-192.png" type="image/png">
    <link rel="apple-touch-icon" href="uygulama/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Matematik Oyunları">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Koyu arkaplan yedeği */
            position: relative;
        }

        /* Arka plan geçişlerinin pürüzsüz olması için özel katman */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
            transition: background-image 0.8s ease-in-out, filter 0.8s ease-in-out;
            background-image: var(--bg-image);
            filter: var(--bg-filter, none);
        }

        /* Üst Menü Cam Efekti */
        .glass-nav {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Genel Cam Paneller (Boş durum, Modallar vb.) */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            color: #f8fafc;
        }

        /* Oyun Kartları */
        .game-card {
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 20px rgba(96, 165, 250, 0.3);
            border-color: rgba(148, 163, 184, 0.5);
            background: rgba(30, 41, 59, 0.85);
        }

        .game-cover {
            height: 180px;
            background-size: cover;
            background-position: center;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #475569;
            position: relative;
        }

        /* Görselin altına hafif karartma geçişi (Yazı daha iyi okunsun diye) */
        .game-cover::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(15,23,42,1), transparent);
        }

        .game-title {
            padding: 16px;
            font-weight: 700;
            text-align: center;
            color: #e2e8f0;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }

        /* Navigasyon Butonları */
        .nav-btn {
            transition: all 0.3s;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .nav-btn.active-gold {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transform: scale(1.05);
        }
        .nav-btn.active-blue {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: scale(1.05);
        }
        .nav-btn.active-purple {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            color: white;
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.4);
            transform: scale(1.05);
        }

        /* Metalik / Parlak Başlık */
        .text-metallic {
            background: linear-gradient(to right, #cbd5e1, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }

        /* Iframe Container */
        #game-frame-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: #000;
        }
        #game-frame { width: 100%; height: 100%; border: none; }
        
        .close-game-btn {
            position: absolute; top: 20px; right: 20px; z-index: 110;
            background: rgba(220, 38, 38, 0.8); color: white; width: 50px; height: 50px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .close-game-btn:hover { background: rgba(220, 38, 38, 1); transform: scale(1.1); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Uygulamayı Yükle düğmesi: logo renkleri (lacivert + altın) */
        .install-btn {
            position: relative; overflow: hidden; align-items: center; gap: 10px;
            height: 46px; padding: 0 20px; border-radius: 999px; white-space: nowrap;
            background: linear-gradient(135deg, #1e3a6e, #0f1f3d);
            border: 1px solid rgba(251, 191, 36, 0.65);
            box-shadow: 0 6px 22px rgba(245, 158, 11, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .install-btn:hover { transform: translateY(-2px); border-color: #fbbf24; box-shadow: 0 10px 30px rgba(245, 158, 11, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        .install-btn:active { transform: translateY(0) scale(0.97); }
        .install-btn:focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; }
        .install-btn::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.28), transparent);
            transform: skewX(-20deg); animation: install-shine 4.5s ease-in-out infinite; pointer-events: none;
        }
        @keyframes install-shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }
        .install-btn > i { color: #fbbf24; font-size: 1rem; }
        .install-long { color: #fff; font-size: 0.95rem; font-weight: 800; letter-spacing: 0.2px; }
        .install-short { display: none; color: #fff; font-size: 0.9rem; font-weight: 800; }
        @media (prefers-reduced-motion: reduce) { .install-btn::after { animation: none; display: none; } }

        /* Dik tablet: menü sığsın diye boşluklar daralır */
        @media (min-width: 768px) and (max-width: 1023px) {
            nav.glass-nav { padding-left: 16px; padding-right: 16px; gap: 12px; }
            #grade-tabs { gap: 8px; }
            #grade-tabs .nav-btn { padding-left: 14px; padding-right: 14px; }
            #portal-title { font-size: 1.35rem; }
            #btn-install { height: 40px; padding: 0 14px; gap: 7px; }
            #btn-install .install-long { display: none; }
            #btn-install .install-short { display: inline; }
        }

        /* Telefon görünümü (tablet ve bilgisayar etkilenmez) */
        @media (max-width: 767px) {
            body { height: 100dvh; }
            /* backdrop-filter fixed alt çubuğu menünün içine hapsediyor; telefonda düz zemin */
            nav.glass-nav { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; backdrop-filter: none; background: rgba(15, 23, 42, 0.95); }
            #portal-logo { width: 38px; height: 38px; font-size: 1.15rem; flex-shrink: 0; }
            #portal-title { font-size: 1.05rem; line-height: 1.2; }
            #grade-tabs {
                position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; gap: 8px;
                padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
                background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px);
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            #grade-tabs .nav-btn { flex: 1; justify-content: center; padding: 11px 2px; font-size: 0.8rem; gap: 4px; white-space: nowrap; border-radius: 14px; transform: none; }
            #btn-install { height: 40px; padding: 0 14px; gap: 7px; }
            #btn-install .install-long { display: none; }
            #btn-install .install-short { display: inline; }
            #portal-main { padding: 14px 14px 100px; }
            #games-container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .game-card:hover { transform: none; }
            .game-cover { height: 110px; font-size: 2.5rem; }
            .game-title { padding: 8px 6px 10px; font-size: 0.85rem; line-height: 1.25; }
            .close-game-btn { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Top Navbar -->
    <nav class="glass-nav w-full py-4 px-8 flex justify-between items-center z-10 sticky top-0">
        <div class="flex items-center gap-4">
            <img id="portal-logo" src="uygulama/simge-dugme.png" alt="Matematik Oyunları logosu" class="w-12 h-12 rounded-xl shadow-lg">
            <h1 id="portal-title" class="text-2xl md:text-3xl font-extrabold text-metallic tracking-tight uppercase">Matematik Oyunları</h1>
        </div>
        
        <div id="grade-tabs" class="flex gap-4">
            <button id="btn-grade-5" onclick="setGrade('5')" class="nav-btn px-6 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-2">
                <i class="fas fa-shapes"></i> 5. Sınıflar
            </button>
            <button id="btn-grade-6" onclick="setGrade('6')" class="nav-btn px-6 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-2.5">
                <div class="flex items-center font-extrabold text-blue-300 leading-none tracking-tighter">
                    <span class="text-sm -translate-y-1.5 translate-x-1">2</span>
                    <span class="text-[10px] translate-y-1.5">3</span>
                    <span class="text-xs -translate-y-0.5 -translate-x-0.5">5</span>
                    <span class="text-[11px] translate-y-1 -translate-x-1">7</span>
                </div>
                6. Sınıflar
            </button>
            <button id="btn-grade-7" onclick="setGrade('7')" class="nav-btn px-6 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-3">
                <span class="font-serif italic font-bold flex items-center gap-0.5 leading-none text-purple-300">
                    <span class="text-base -mt-3">x</span>
                    <span class="text-xl">y</span>
                    <span class="text-sm mt-3">z</span>
                </span>
                7. Sınıflar
            </button>
        </div>
        
        <div class="flex items-center">
        <!-- Uygulamayı Yükle: yalnız tarayıcı yüklemeye izin verince görünür -->
        <button id="btn-install" onclick="installApp()" title="Matematik Oyunları uygulamasını yükle" aria-label="Uygulamayı Yükle" class="hidden install-btn">
            <i class="fas fa-download"></i><span class="install-long">Uygulamayı Yükle</span><span class="install-short">Yükle</span>
        </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="portal-main" class="flex-1 overflow-y-auto p-8 relative z-0">
        <div id="games-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8 max-w-7xl mx-auto">
            <!-- Oyunlar buraya yüklenecek -->
        </div>
        
        <div id="empty-state" class="hidden flex flex-col items-center justify-center h-full glass-panel rounded-3xl p-12 max-w-lg mx-auto mt-20 text-center">
            <div class="w-24 h-24 rounded-full bg-slate-800 flex items-center justify-center mb-6 shadow-inner border border-slate-700">
                <i class="fas fa-folder-open text-5xl text-slate-500"></i>
            </div>
            <h2 class="text-3xl font-bold mb-3 text-slate-200">Kayıt Bulunamadı</h2>
            <p class="text-slate-400 text-lg leading-relaxed">Bu sınıfa ait etkinlik henüz eklenmedi.</p>
        </div>
    </main>

    <!-- Game Player (Iframe) -->
    <div id="game-frame-container">
        <div class="close-game-btn" onclick="closeGame()">
            <i class="fas fa-times"></i>
        </div>
        <iframe id="game-frame" srcdoc=""></iframe>
    </div>

    <!-- Veritabanı Dosyası -->
    <script src="./oyunlar.js"></script>
    <script>
    const DB_KEY = 'edu_games_db';
    
    // Arka plan resimleri
    const BG_5 = './arkaplan5.jpg';
    const BG_6 = './arkaplan6.jpg';

    let currentGrade = '5';
    let games = []; // oyunlar.js'den dolacak

    window.onload = () => {
        loadGamesFromDB();
        setGrade('5');
    };

    function loadGamesFromDB() {
        // oyunlar.js içindeki SISTEM_OYUNLARI listesini al
        if (typeof SISTEM_OYUNLARI !== 'undefined') {
            games = [...SISTEM_OYUNLARI];
        }

        // Test amaçlı tarayıcıya eklenenleri de al
        const stored = localStorage.getItem(DB_KEY);
        if (stored) {
            const userGames = JSON.parse(stored);
            // Sadece test için eklenen oyunları filtrele
            const testGames = userGames.filter(ug => !ug.id.includes('oyun-'));
            games = [...games, ...testGames];
        }
    }

    function saveGamesToDB() {
        localStorage.setItem(DB_KEY, JSON.stringify(games));
    }

    function setGrade(grade) {
        currentGrade = grade;
        
        const btn5 = document.getElementById('btn-grade-5');
        const btn6 = document.getElementById('btn-grade-6');
        const btn7 = document.getElementById('btn-grade-7');
        
        btn5.className = "nav-btn px-6 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-2";
        btn6.className = "nav-btn px-6 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-3";
        btn7.className = "nav-btn px-6 py-2.5 rounded-full font-bold shadow-sm flex items-center gap-3";
        
        const bgElem = document.body;

        if(grade === '5') {
            btn5.classList.add('active-gold');
            bgElem.style.setProperty('--bg-image', `url('${BG_5}')`);
            bgElem.style.setProperty('--bg-filter', 'none');
        } else if (grade === '6') {
            btn6.classList.add('active-blue');
            bgElem.style.setProperty('--bg-image', `url('${BG_6}')`);
            bgElem.style.setProperty('--bg-filter', 'none');
        } else if (grade === '7') {
            btn7.classList.add('active-purple');
            bgElem.style.setProperty('--bg-image', `url('${BG_6}')`);
            bgElem.style.setProperty('--bg-filter', 'hue-rotate(60deg)');
        }

        renderGames();
    }

    function renderGames() {
        const container = document.getElementById('games-container');
        const emptyState = document.getElementById('empty-state');
        container.innerHTML = '';

        const filteredGames = games.filter(g => g.grade === currentGrade);

        if (filteredGames.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            
            filteredGames.forEach((game) => {
                const card = document.createElement('div');
                card.className = 'game-card group';
                card.onclick = () => playGame(game.id);

                let coverHtml = '';
                if (game.image && game.image.trim() !== '') {
                    coverHtml = `<div class="game-cover" style="background-image: url('${game.image}')"></div>`;
                } else {
                    coverHtml = `<div class="game-cover group-hover:text-blue-400 transition-colors"><i class="fas fa-cubes"></i></div>`;
                }

                card.innerHTML = `
                    ${coverHtml}
                    <div class="game-title relative z-10">${game.title}</div>
                `;
                container.appendChild(card);
            });
        }
    }

    /*
      AKILLI ÖĞRENCİ LİSTESİ ENJEKSİYONU:
      Portaldan bir oyun açılırken (veya yeni oyun eklenirken), o oyunun içindeki
      STUDENTS_NODE değişkenini otomatik olarak ilgili sınıfın merkezi listesine
      ('students_grade_5', 'students_grade_6', 'students_grade_7') yönlendirir!
      Böylece eski/yeni hangi oyunu yüklersen yükle, o sınıfın öğrencileri otomatik açılır!
    */
    function injectCentralStudentsIntoGameCode(rawCode, gameGrade) {
        if (!rawCode) return rawCode;
        const targetGrade = gameGrade || currentGrade || '5';
        const centralNode = `students_grade_${targetGrade}`;
        // const STUDENTS_NODE = '...'; satırını merkezi sınıf düğümüne çevir
        return rawCode.replace(/const\s+STUDENTS_NODE\s*=\s*['"][^'"]+['"]\s*;/g, `const STUDENTS_NODE = '${centralNode}';`);
    }

    function playGame(id) {
        const game = games.find(g => g.id === id);
        if (game) {
            const frame = document.getElementById('game-frame');
            const container = document.getElementById('game-frame-container');
            
            if (game.url) {
                frame.removeAttribute('srcdoc');
                frame.src = game.url;
            } else {
                frame.removeAttribute('src');
                frame.srcdoc = injectCentralStudentsIntoGameCode(game.code, game.grade);
            }
            
            container.style.display = 'block';
        }
    }

    function closeGame() {
        const frame = document.getElementById('game-frame');
        const container = document.getElementById('game-frame-container');
        container.style.display = 'none';
        frame.srcdoc = ''; 
    }

    // --- Uygulama olarak yükleme (PWA) ---
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    let installPrompt = null;
    const installBtn = document.getElementById('btn-install');
    window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        installPrompt = e;
        installBtn.classList.remove('hidden');
        installBtn.classList.add('flex');
    });
    window.addEventListener('appinstalled', () => installBtn.classList.add('hidden'));
    async function installApp() {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installBtn.classList.add('hidden');
    }
</script>
</body>
</html>
